<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上購物研究</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #606f7b;
            --accent-color: #34495e;
            --hover-color: #2c3e50;
            --border-color: #e2e8f0;
            --focus-ring: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 680px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 40px;
            border: 1px solid var(--border-color);
        }

        header {
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .academic-badge {
            display: inline-block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: #718096;
            background-color: #edf2f7;
            padding: 4px 10px;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        p.intro {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 28px;
        }

        label.question-title {
            display: block;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .question-title .required {
            color: #e53e3e;
            margin-left: 4px;
        }

        .radio-group, .radio-grid {
            display: flex;
            gap: 12px;
        }

        .radio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
        }

        .radio-card {
            position: relative;
            flex: 1;
        }

        .radio-card input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .radio-card label {
            display: block;
            text-align: center;
            padding: 12px 16px;
            background-color: #fafafa;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .radio-card label:hover {
            border-color: #cbd5e1;
            background-color: #f8fafc;
        }

        .radio-card input[type="radio"]:checked + label {
            border-color: var(--accent-color);
            background-color: #f1f5f9;
            color: var(--accent-color);
            font-weight: 600;
            box-shadow: 0 0 0 1px var(--accent-color);
        }

        .radio-card input[type="radio"]:focus-visible + label {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        .input-text {
            width: 100%;
            padding: 12px 16px;
            font-size: 0.95rem;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            background-color: #fafafa;
            color: var(--text-primary);
            transition: all 0.2s ease;
            outline: none;
        }

        .input-text:focus {
            border-color: var(--accent-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(52, 73, 94, 0.1);
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: var(--hover-color);
        }

        .submit-btn:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--bg-color);
            padding-top: 15px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px;
            }
            .radio-group {
                flex-direction: column;
            }
            .radio-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>消費者於線上超市選購食品的考慮因素調查</h1>
            <p class="intro">您好！這是一份學術性調查問卷，旨在了解消費者在線上超市選購食品時的決策與偏好。本問卷採取匿名方式，所有數據僅供學術統計與分析使用，請安心填寫。</p>
        </header>

        <form id="surveyForm" onsubmit="handleSubmit(event)">

            <div class="form-group">
                <label class="question-title" for="participant_id">1. 請輸入您的受試者編號 (Participant ID) <span class="required">*</span></label>
                <!-- 修改 type="number" 確保輸入必須為純數字 -->
                <input type="number" id="participant_id" name="participant_id" class="input-text" placeholder="請輸入純數字 (例如：101)" required min="1">
            </div>

            <!-- 問題 1：價格重視程度 -->
            <div class="form-group">
                <label class="question-title">1. 在選購食品時，您對「價格」的重視程度為何？ <span class="required">*</span></label>
                <div class="radio-group">
                    <div class="radio-card">
                        <input type="radio" id="price_high" name="price_importance" value="high" required>
                        <label for="price_high">高</label>
                    </div>
                    <div class="radio-card">
                        <input type="radio" id="price_mid" name="price_importance" value="medium">
                        <label for="price_mid">中</label>
                    </div>
                    <div class="radio-card">
                        <input type="radio" id="price_low" name="price_importance" value="low">
                        <label for="price_low">低</label>
                    </div>
                </div>
            </div>

            <!-- 問題 2：環保重視程度 -->
            <div class="form-group">
                <label class="question-title">2. 在選購食品時，您對「環保/健康」的重視程度為何？ <span class="required">*</span></label>
                <div class="radio-group">
                    <div class="radio-card">
                        <input type="radio" id="eco_high" name="eco_importance" value="high" required>
                        <label for="eco_high">高</label>
                    </div>
                    <div class="radio-card">
                        <input type="radio" id="eco_mid" name="eco_importance" value="medium">
                        <label for="eco_mid">中</label>
                    </div>
                    <div class="radio-card">
                        <input type="radio" id="eco_low" name="eco_importance" value="low">
                        <label for="eco_low">低</label>
                    </div>
                </div>
            </div>

            <!-- 問題 3：預算金額 -->
            <div class="form-group">
                <label class="question-title" for="budget">3. 為預備一餐晚飯的食材，您通常願意在線上超市購物的預算金額為多少？ <span class="required">*</span></label>
                <input type="number" id="budget" name="budget" class="input-text" placeholder="請輸入金額 (港幣)" min="1" required>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                提交並前往線上購物商城
            </button>
        </form>
    </div>

    <script>
        const API_URL = "/api/recommend";

        const productsList = [
            { id: 1, name: "Red Fuji Apple", price: 5.99, isEco: true },
            { id: 2, name: "Whole Milk", price: 12.50, isEco: true },
            { id: 3, name: "Whole Wheat Bread", price: 8.99, isEco: true },
            { id: 4, name: "Farm Fresh Eggs", price: 15.00, isEco: true },
            { id: 5, name: "Natural Mineral Water", price: 2.50, isEco: true },
            { id: 6, name: "Fresh Beef", price: 18.99, isEco: true },
            { id: 8, name: "Raw Chicken Legs", price: 9.99, isEco: true },
            { id: 10, name: "Fresh Cucumber", price: 1.99, isEco: true },
            { id: 13, name: "Long Grain Rice", price: 6.99, isEco: true },
            { id: 15, name: "Fresh Avocado", price: 3.49, isEco: true },
            { id: 16, name: "Fresh Salmon Fillet", price: 22.99, isEco: true },
        ];

        async function handleSubmit(event) {
            event.preventDefault();

            const formData = new FormData(event.target);
            const rawParticipantID = formData.get('participant_id').trim();
            const participantNum = parseInt(rawParticipantID, 10);

            if (isNaN(participantNum)) {
                alert('請輸入有效的數字受試者編號！');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = (participantNum % 2 !== 0)
                ? 'AI 正在分析偏好並挑選推薦商品...'
                : '正在載入到線上超市';

            localStorage.setItem("participantID", participantNum);

            const targetPage = (participantNum % 2 !== 0)
                ? 'grocery_ai_page.html'
                : 'grocery_traditional_page.html';

            const userPreferences = {
                price_sensitivity: formData.get('price_importance'),
                sustainability_importance: formData.get('eco_importance'),
                budget: parseFloat(formData.get('budget')) || 0
            };

            const payload = {
                products: productsList,
                preferences: userPreferences
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`API 伺服器回應錯誤: ${response.status}`);
                }

                const recommendations = await response.json();
                console.log('AI Nudge 結果:', recommendations);

                localStorage.setItem('ai_recommendations', JSON.stringify(recommendations));
                localStorage.setItem('user_preferences', JSON.stringify(userPreferences));

                // 跳轉至對應頁面
                window.location.href = targetPage;

            } catch (error) {
                console.error('API 請求失敗:', error);
                alert('AI 推薦服務連線超時，將跳轉至商城頁面。');

                // 發生錯誤時依然依據單偶數跳轉
                window.location.href = targetPage;
            }
        }
    </script>
</body>
</html>
